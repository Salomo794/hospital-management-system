<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .joke-display {
            min-height: 120px;
            margin: 30px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .joke-text {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
            font-weight: 500;
            animation: slideIn 0.5s ease-in;
        }

        .loading {
            font-size: 16px;
            color: #667eea;
            font-weight: bold;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .placeholder {
            font-size: 16px;
            color: #999;
            font-style: italic;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .error-message {
            background: #fee;
            border: 2px solid #f99;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            color: #c33;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .joke-count {
            margin-top: 30px;
            font-size: 14px;
            color: #999;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .joke-text {
                font-size: 16px;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Random Joke Generator</h1>
        
        <div class="joke-display">
            <p id="jokeDisplay" class="placeholder">Click the button to get a joke!</p>
        </div>

        <div class="button-group">
            <button id="jokeBtn" class="btn-primary" onclick="getJoke()">Get a Joke</button>
            <button id="copyBtn" class="btn-secondary" onclick="copyToClipboard()" style="display: none;">Copy Joke</button>
        </div>

        <div id="errorMsg" class="error-message">
            <p id="errorText"></p>
        </div>

        <div class="joke-count">
            Jokes loaded: <span id="jokeCount">0</span>
        </div>
    </div>

    <script>
        let jokeCount = 0;
        let currentJoke = '';

        async function getJoke() {
            const jokeDisplay = document.getElementById('jokeDisplay');
            const jokeBtn = document.getElementById('jokeBtn');
            const copyBtn = document.getElementById('copyBtn');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');

            // Reset states
            errorMsg.classList.remove('show');
            jokeBtn.disabled = true;
            jokeDisplay.className = 'loading';
            jokeDisplay.textContent = 'Loading joke...';
            copyBtn.style.display = 'none';

            try {
                const response = await fetch('https://official-joke-api.appspot.com/random_joke');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();
                
                // Combine setup and punchline
                currentJoke = `${data.setup} ${data.punchline}`;
                jokeCount++;

                // Display joke
                jokeDisplay.className = 'joke-text';
                jokeDisplay.textContent = currentJoke;
                document.getElementById('jokeCount').textContent = jokeCount;
                copyBtn.style.display = 'inline-block';

            } catch (err) {
                console.error('Error:', err);
                errorText.textContent = 'Oops! Could not fetch a joke. Please try again.';
                errorMsg.classList.add('show');
                jokeDisplay.className = 'placeholder';
                jokeDisplay.textContent = 'Click the button to get a joke!';
            } finally {
                jokeBtn.disabled = false;
                jokeBtn.textContent = 'Get a Joke';
            }
        }

        function copyToClipboard() {
            if (currentJoke) {
                navigator.clipboard.writeText(currentJoke).then(() => {
                    alert('Joke copied to clipboard! 📋');
                }).catch(() => {
                    alert('Failed to copy joke');
                });
            }
        }

        // Auto-load a joke when page loads
        window.addEventListener('load', () => {
            getJoke();
        });
    </script>
</body>
</html>
