name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    env:
      NODE_ENV: test
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          client/package-lock.json
          server/package-lock.json
    - name: Install dependencies
      run: |
        npm ci
        npm ci --prefix client
        npm ci --prefix server
    - name: Initialize and seed database
      # `runner` is only in scope inside a step, never in a job-level env block.
      # Referencing it there made the whole workflow invalid, so GitHub rejected
      # the file before running anything and every run failed with no jobs.
      env:
        DB_PATH: ${{ runner.temp }}/hms-ci/hospital.db
      run: |
        npm run db:setup
        npm run db:seed
    - name: Lint client
      run: npm run lint
    - name: Test server
      run: npm test
    - name: Test client
      run: npm run test:client
    - name: Build client
      run: npm run build
    - name: Audit production dependencies
      run: npm run audit
