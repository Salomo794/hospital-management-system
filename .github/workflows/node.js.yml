name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    env:
      NODE_ENV: test
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/hms_test

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          client/package-lock.json
          server/package-lock.json
    - name: Install dependencies
      run: |
        npm ci
        npm ci --prefix client
        npm ci --prefix server
    - name: Initialize and seed database
      run: |
        npm run db:setup
        npm run db:seed
    - name: Lint client
      run: npm run lint
    - name: Test server
      run: npm test
    - name: Test client
      run: npm run test:client
    - name: Build client
      run: npm run build
    - name: Audit production dependencies
      run: npm run audit
